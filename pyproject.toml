[project]
name = "moodify"
version = "1.0.0"
description = "Share a song for a feeling, get one back"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["moodify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
